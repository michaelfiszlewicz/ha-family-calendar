# =============================================================================
# configuration_additions.yaml
# =============================================================================
# These snippets go into your Home Assistant `configuration.yaml`
# (Settings -> the file, or edit via the File Editor / Studio Code Server add-on).
#
# Copy each block into the matching top-level key. If a key (e.g. `calendar:`)
# already exists in your configuration.yaml, MERGE the entries instead of adding
# a second key — YAML does not allow the same top-level key twice.
#
# After editing: Developer Tools -> YAML -> "Check Configuration", then
# "Restart" Home Assistant.
# =============================================================================


# -----------------------------------------------------------------------------
# 1) CALENDARS  (ICS / iCal subscriptions)
# -----------------------------------------------------------------------------
# *** YOU ARE USING THE BUILT-IN "Remote Calendar" INTEGRATION ***
# (Settings -> Devices & Services -> Remote Calendar)
# No YAML calendar block is needed — do NOT add one; it will cause a
# "Platform error: calendar - Integration 'ics' not found" error.
#
# The dashboard expects these exact entity IDs.  When you added each calendar
# via the UI, HA auto-generated the entity ID from the name you typed.
# Check Settings -> Devices & Services -> Remote Calendar -> each entry and
# make sure the names match (or go to Developer Tools -> States and search
# "calendar." to see what was created):
#
#   Name typed in UI             Expected entity ID
#   ─────────────────────────    ──────────────────────────────
#   "iCloud Family Calendar" ->  calendar.icloud_family_calendar
#   "Google Mike"            ->  calendar.google_mike
#   "Google Juno"            ->  calendar.google_juno
#   "US Holidays"            ->  calendar.us_holidays
#   "Jewish Holidays"        ->  calendar.jewish_holidays
#
# If your entity IDs differ (e.g. calendar.remote_calendar or calendar.mike),
# either rename the integration entries in the UI to match the names above,
# OR update family_dashboard.yaml to use your actual entity IDs.


# -----------------------------------------------------------------------------
# 2) WEATHER  (Open-Meteo — free, no API key)
# -----------------------------------------------------------------------------
# Preferred: add Open-Meteo via the UI (Settings -> Devices & Services -> Add
# Integration -> "Open-Meteo"). It will create a weather.* entity.
# Liberty Township, OH 45050  ->  lat 39.3778, lon -84.3591
#
# The dashboard expects an entity called `weather.home` (or edit the dashboard
# to match whatever name your integration produces, e.g. weather.openmeteo).


# -----------------------------------------------------------------------------
# 3) INPUT HELPERS  (screen rotation + photo slideshow index)
# -----------------------------------------------------------------------------
input_number:
  # Which of the 3 screens is currently shown (1, 2, or 3).
  dashboard_screen:
    name: Dashboard Screen
    min: 1
    max: 3
    step: 1
    mode: box
    icon: mdi:monitor-dashboard

  # Rolling index used to advance the landscape photo slideshow.
  photo_index_landscape:
    name: Photo Index Landscape
    min: 0
    max: 9999
    step: 1
    mode: box
    icon: mdi:image-multiple

  # Rolling index used to advance the portrait photo slideshow.
  photo_index_portrait:
    name: Photo Index Portrait
    min: 0
    max: 9999
    step: 1
    mode: box
    icon: mdi:image-multiple

input_boolean:
  # Flip OFF to pause the automatic 20-second screen rotation (handy while
  # you're setting things up or want to stare at the calendar).
  dashboard_rotate:
    name: Dashboard Auto-Rotate
    initial: true
    icon: mdi:rotate-3d-variant


# -----------------------------------------------------------------------------
# 4) SHELL COMMAND  (runs the iCloud photo downloader)
# -----------------------------------------------------------------------------
# Place icloud_photos.py at /config/scripts/icloud_photos.py (see README).
# The script writes into /config/www/family_photos/ which HA serves at /local/.
shell_command:
  fetch_icloud_photos: "python3 /config/scripts/icloud_photos.py --output /config/www/family_photos"


# -----------------------------------------------------------------------------
# 5) TEMPLATE SENSORS  (current photo path for each slideshow)
# -----------------------------------------------------------------------------
# These read the index.json files written by icloud_photos.py and expose the
# "current" photo (based on the rolling index above), so the picture cards can
# bind to a single sensor and simply update when the index changes.
#
# Requires the `command_line` + `template` integrations (both built in).
template:
  - trigger:
      # Recompute whenever the slideshow index changes or HA starts.
      - platform: state
        entity_id:
          - input_number.photo_index_landscape
          - input_number.photo_index_portrait
      - platform: homeassistant
        event: start
      - platform: time_pattern
        minutes: "/5"   # also refresh periodically in case photos changed
    sensor:
      - name: "Current Landscape Photo"
        unique_id: current_landscape_photo
        state: >
          {% set p = states('sensor.landscape_photo_count') | int(0) %}
          {{ p }}
        # The picture card actually uses the attribute below.
        attributes:
          image: >
            {%- set idx = states('input_number.photo_index_landscape') | int(0) -%}
            {%- set data = state_attr('sensor.landscape_index','photos') -%}
            {%- if data and data | length > 0 -%}
              {{ data[idx % (data | length)].file }}
            {%- else -%}
              /local/family_photos/landscape/placeholder.jpg
            {%- endif -%}
      - name: "Current Portrait Photo"
        unique_id: current_portrait_photo
        state: >
          {% set p = states('sensor.portrait_photo_count') | int(0) %}
          {{ p }}
        attributes:
          image: >
            {%- set idx = states('input_number.photo_index_portrait') | int(0) -%}
            {%- set data = state_attr('sensor.portrait_index','photos') -%}
            {%- if data and data | length > 0 -%}
              {{ data[idx % (data | length)].file }}
            {%- else -%}
              /local/family_photos/portrait/placeholder.jpg
            {%- endif -%}


# -----------------------------------------------------------------------------
# 6) COMMAND-LINE SENSORS  (load index.json produced by the photo script)
# -----------------------------------------------------------------------------
# These read the JSON index files so the template sensors above can enumerate
# photos. `value_template` keeps the state short (the count) while the full
# photo list is exposed as the `photos` attribute.
command_line:
  - sensor:
      name: "Landscape Index"
      unique_id: landscape_index
      command: "cat /config/www/family_photos/landscape/index.json 2>/dev/null || echo '{\"count\":0,\"photos\":[]}'"
      value_template: "{{ value_json.count }}"
      json_attributes:
        - photos
      scan_interval: 300

  - sensor:
      name: "Portrait Index"
      unique_id: portrait_index
      command: "cat /config/www/family_photos/portrait/index.json 2>/dev/null || echo '{\"count\":0,\"photos\":[]}'"
      value_template: "{{ value_json.count }}"
      json_attributes:
        - photos
      scan_interval: 300

  - sensor:
      name: "Landscape Photo Count"
      unique_id: landscape_photo_count
      command: "cat /config/www/family_photos/landscape/index.json 2>/dev/null || echo '{\"count\":0}'"
      value_template: "{{ value_json.count }}"
      scan_interval: 300

  - sensor:
      name: "Portrait Photo Count"
      unique_id: portrait_photo_count
      command: "cat /config/www/family_photos/portrait/index.json 2>/dev/null || echo '{\"count\":0}'"
      value_template: "{{ value_json.count }}"
      scan_interval: 300


# -----------------------------------------------------------------------------
# 7) INCLUDE THE AUTOMATIONS
# -----------------------------------------------------------------------------
# If you use the default `automation: !include automations.yaml`, either paste
# the contents of the files in ./automations/ into automations.yaml, OR switch
# to a directory include and drop the files in /config/automations/:
#
#   automation: !include_dir_merge_list automations/
#
# See README section 6 for the exact steps.
